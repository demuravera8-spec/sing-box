name: Build patched sing-box 1.12.4

on:
  workflow_dispatch:
  push:
    branches:
      - fix-1.12.4-reality
    paths:
      - 'common/tls/reality_client.go'
      - '.github/workflows/build-patched.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'

      - name: Build sing-box
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          BUILD_TAGS: with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale
        run: |
          mkdir -p dist
          go build -v -trimpath \
            -tags "$BUILD_TAGS" \
            -ldflags "-s -w -buildid= -X github.com/sagernet/sing-box/constant.Version=1.12.4-reality" \
            -o dist/sing-box \
            ./cmd/sing-box
          sha256sum dist/sing-box > dist/sing-box.sha256

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-${{ matrix.arch }}
          path: dist/
          retention-days: 7
